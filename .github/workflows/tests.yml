name: Runner tests

on: [push, pull_request]

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        ansible: ['ansible-core==2.16.*', 'ansible-core>=2.19']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install macOS shell tools
        if: runner.os == 'macOS'
        run: |
          brew install bash flock
          echo "$(brew --prefix bash)/bin" >> "$GITHUB_PATH"
      - name: Install Python test dependencies
        run: python -m pip install '${{ matrix.ansible }}' PyYAML
      - name: Check required tools and shell syntax
        shell: bash
        run: |
          command -v ansible-playbook ansible-galaxy ansible-vault flock ps curl
          git ls-files '*.sh' | while IFS= read -r script; do
            bash -n "$script"
          done
      - name: Run regression tests
        shell: python
        run: |
          import sys
          import unittest

          suite = unittest.defaultTestLoader.discover('runner_tests')
          result = unittest.TextTestRunner(verbosity=2).run(suite)
          for test, traceback in result.failures + result.errors:
              message = f'{test}\n{traceback}'
              message = message.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
              print(f'::error title=Regression test failure::{message}', flush=True)
          sys.exit(not result.wasSuccessful())
